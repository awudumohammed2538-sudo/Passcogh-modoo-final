<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07543f"><title>PASSCOGH-MODOO</title>
<style>
:root{--g:#07543f;--g2:#0a875d;--gold:#f4cb36;--bg:#f2f8f5;--ink:#13251e;--muted:#667870;--line:#d6e5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;background:var(--g);color:#fff;box-shadow:0 3px 15px #0003}.bar{max-width:1180px;margin:auto;padding:9px 12px;display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px}.brand{font-weight:900}.brand small{display:block;color:#ffe263;font-size:9px}.nav{margin-left:auto;display:flex;gap:5px;overflow:auto}.nav button{white-space:nowrap;border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:10px;padding:10px;font-weight:800}
main{max-width:1180px;margin:auto;padding:16px 12px 80px}.hero{background:linear-gradient(135deg,#064b3a,#0b8a60);color:#fff;border-radius:23px;padding:25px;margin-bottom:14px}.hero h1{font-size:34px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 5px 18px #113d3010}.btn{border:0;border-radius:12px;padding:12px 15px;min-height:44px;font-weight:900;cursor:pointer}.gold{background:var(--gold)}.primary{background:var(--g2);color:#fff}.light{background:#fff;color:var(--g)}.muted{color:var(--muted)}.box{border-radius:14px;padding:14px;margin:12px 0;line-height:1.6}.green{background:#e8f7ed}.yellow{background:#fff4b7}.red{background:#fff0ed}input,select{width:100%;font-size:16px;padding:12px;border:1px solid #cadbd4;border-radius:11px;background:#fff;margin:5px 0 12px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:9px 11px;background:#e8f3ef;border-radius:999px}.modal{display:none;position:fixed;inset:0;background:#00140eb0;z-index:100;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modalbox{width:100%;max-width:900px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;position:relative}.close{position:absolute;right:9px;top:8px;width:40px;height:40px;border:0;border-radius:50%;font-size:24px}.ad{display:none;background:#fff9d9;border:1px solid #e3d17a;border-radius:14px;padding:14px;margin:14px 0}.ad.show{display:block}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:760px){.nav{display:none}.hero h1{font-size:28px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="bar"><div class="logo">🇬🇭</div><div class="brand">PASSCOGH-MODOO<small>LEARN • PRACTISE • PASS • PLAN</small></div><div class="nav"><button onclick="home()">Home</button><button onclick="jhs()">JHS</button><button onclick="shs()">SHS</button><button onclick="finder()">🎯 Finder</button><button onclick="tertiary()">🎓 Tertiary</button><button onclick="skills()">🚀 Skills</button></div></div></header>
<main id="app"></main><div id="ad" class="ad"><b>Sponsored study break</b><span id="adText">Your support helps keep PASSCOGH-MODOO running.</span><button class="btn" onclick="hideAd()">Continue studying</button></div>
<footer style="text-align:center;color:#68776f;padding:20px">© PASSCOGH-MODOO • Awudu Mohammed Modoo Ayariga</footer>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div>
<script>
const A=document.getElementById("app"),ad=document.getElementById("ad");let R,DB,studyStart=Date.now(),quiz=false;
const esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function boot(){R=await(await fetch("/api/registry")).json();DB=await(await fetch("/api/curriculum")).json();home();setInterval(()=>{if(!quiz&&Date.now()-studyStart>=15*60*1000){ad.classList.add("show");studyStart=Date.now()}},1000)}
function home(){A.innerHTML=`<section class="hero"><b>🇬🇭 Ghana's learner + future-planning platform</b><h1>Learn it. Understand it. Remember it. Plan your future.</h1><p>JHS • SHS/WASSCE • NaCCA curriculum • Notes • Diagrams • Mnemonics • Worked solutions • Course Finder • University & College guidance • Skills.</p><button class="btn gold" onclick="finder()">🎯 Find My Course</button> <button class="btn light" onclick="shs()">📚 Start SHS</button></section>
<div class="grid"><div class="card"><h3>📚 Full Curriculum Centre</h3><p>Current official NaCCA curriculum documents are indexed server-side.</p><button class="btn primary" onclick="curriculum()">Open</button></div><div class="card"><h3>🧠 Memory Method</h3><p>Funny/familiar acronyms with every letter explained and tied to the concept.</p></div><div class="card"><h3>🧮 Problem Solver</h3><p>Given → Required → Principle → Why → Substitute → Work → Unit → Answer → Check.</p></div><div class="card"><h3>🎯 Course Finder</h3><p>Use grades + interests to explore course families before tertiary application.</p><button class="btn primary" onclick="finder()">Open</button></div><div class="card"><h3>🎓 Tertiary</h3><p>Universities, university colleges, technical universities, colleges, schools and institutes.</p><button class="btn primary" onclick="tertiary()">Open</button></div><div class="card"><h3>🚀 Skills</h3><p>Digital, coding, study and career skills.</p><button class="btn primary" onclick="skills()">Open</button></div></div>
<div class="box green"><b>Why PASSCOGH?</b><br>We use the official curriculum as the structure, then add an original learner-friendly teaching layer instead of pretending copied curriculum text is PASSCOGH content.</div>`}
function jhs(){levels("JHS",R.jhsSubjects)}function shs(){levels("SHS",R.shsSubjects)}
function levels(l,ss){A.innerHTML=`<h2>${l} Subjects</h2><p class="muted">${l==="JHS"?"JHS 1–3 • Common Core Programme":"SHS 1–3 • Secondary Education curriculum"}</p><input id="search" placeholder="🔎 Search subject" oninput="filter()"><div id="grid" class="grid">${ss.map(s=>`<div class="card subject"><h3>${esc(s)}</h3><p class="muted">${l==="JHS"?"CCP":"SHS"}</p><button class="btn primary" onclick="subject('${esc(s)}','${l}')">Open subject</button></div>`).join("")}</div>`}
function filter(){let q=document.getElementById("search").value.toLowerCase();document.querySelectorAll(".subject").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none")}
async function subject(s,l){let d=await(await fetch("/api/curriculum?level="+l+"&subject="+encodeURIComponent(s))).json();openM(`<h2>${esc(s)}</h2><p>${d.count?`Official curriculum document indexed: ${d.count}.`:"The curriculum importer has not been run on this deployment yet."}</p>${(d.documents||[]).map(x=>`<div class="card"><b>${esc(x.subject)}</b><p>Pages: ${x.pages||"—"} • Indexed words: ${x.words||"—"}</p><p><b>Detected curriculum structure:</b> ${esc((x.headings||[]).slice(0,80).join(" • "))}</p><p><a href="${esc(x.source)}" target="_blank" rel="noopener">Open official source</a></p></div>`).join("")}<div class="box yellow"><b>PASSCOGH lesson template</b><br>Objective → Strand/Sub-strand → Content Standard → Indicator → Exemplar → Simple explanation → Mnemonic → Diagram → Worked example → Step-by-step → Mistakes → Practice → Answers → Practical → Quiz → Exam focus.</div>`)}
function curriculum(){A.innerHTML=`<h2>📚 Curriculum Centre</h2><div class="box ${DB.generated?"green":"yellow"}"><b>${DB.generated?"✅ Curriculum index loaded":"⏳ Curriculum sync is pending"}</b><br>${DB.generated?`${DB.count||DB.documents.length} official curriculum documents indexed.`:"Render runs the official NaCCA importer during deployment; students do not download the curriculum PDFs."}</div><div class="grid"><div class="card"><h3>JHS / CCP</h3><p>${R.jhsSubjects.length} subjects.</p><button class="btn primary" onclick="jhs()">Browse</button></div><div class="card"><h3>SHS</h3><p>${R.shsSubjects.length} subjects in the master registry.</p><button class="btn primary" onclick="shs()">Browse</button></div></div>`}
function finder(){A.innerHTML=`<section class="hero"><b>🎯 COURSE & FUTURE FINDER</b><h1>Know your options before you enter the field.</h1><p>Enter results or use the finder without storing your index number publicly.</p></section><div class="card"><h3>Core grades</h3>${sel("English Language","English")}${sel("Core Mathematics","Core Mathematics")}${sel("Integrated Science","Integrated Science")}${sel("Social Studies","Social Studies")}<h3>Electives</h3>${sel("Elective 1","Elective 1 Subject")}${sel("Elective 2","Elective 2 Subject")}<h3>Interests</h3><div class="chips">${["Health","Engineering","Computing","Business","Law & Governance","Education","Science & Research","Agriculture","Creative Arts"].map(x=>`<label class="chip"><input type="checkbox" value="${x}" style="width:auto"> ${x}</label>`).join("")}</div><br><button class="btn gold" onclick="runFinder()">🔎 Find my pathways</button></div><div id="findres"></div>`}
function sel(id,label){return `<label>${label}</label><select id="${id.replaceAll(" ","_")}"><option>A1</option><option>B2</option><option>B3</option><option>C4</option><option>C5</option><option>C6</option><option>D7</option><option>E8</option><option>F9</option></select>`}
async function runFinder(){let ids=["English","Core_Mathematics","Integrated_Science","Social_Studies","Elective_1_Subject","Elective_2_Subject"],g={};ids.forEach((x,i)=>g[x]=document.getElementById(x)?.value);let interests=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);let d=await(await fetch("/api/finder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({grades:g,interests})})).json();document.getElementById("findres").innerHTML=`<div class="card"><h2>Indicative profile</h2><div style="font-size:38px;font-weight:900;color:#07543f">${d.aggregate}</div><p>Simple profile score — <b>not an official WASSCE aggregate or admission decision.</b></p></div><div class="grid">${d.results.map(x=>`<div class="card"><h3>🟢 ${x.name}</h3><p><b>Possible programme families:</b> ${x.programmes.join(" • ")}</p><p>${x.why}</p><button class="btn primary" onclick="compare('${esc(x.name)}')">Compare institutions</button></div>`).join("")}</div><div class="box red">${d.disclaimer}</div>`}
function compare(x){openM(`<h2>🏫 Institution comparison — ${x}</h2><table><tr><th>Check</th><th>What PASSCOGH should verify</th></tr><tr><td>Programme</td><td>Currently offered programme.</td></tr><tr><td>Entry requirements</td><td>Current official requirements.</td></tr><tr><td>Accreditation</td><td>GTEC/official institutional evidence.</td></tr><tr><td>Fees</td><td>Current official fees.</td></tr><tr><td>Location</td><td>Campus and learner preference.</td></tr><tr><td>Deadline</td><td>Current official application deadline.</td></tr></table><p class="muted">GTEC advises prospective students to verify accreditation directly with the Commission.</p>`)}
function tertiary(){A.innerHTML=`<h2>🎓 University & College Guide</h2><p>Verified institution data should be refreshed from GTEC/official institution sources before publication.</p><div class="grid">${R.tertiaryCategories.map(x=>`<div class="card"><h3>${x}</h3><p>Institution → Programme → Requirements → Accreditation → Application.</p><button class="btn primary" onclick="openM('<h2>${esc(x)}</h2><p>Use verified GTEC/official institution records here. Do not present unverified institutions as accredited.</p>')">Explore</button></div>`).join("")}</div>`}
function skills(){A.innerHTML=`<h2>🚀 Skills Academy</h2><div class="grid">${["Coding Fundamentals","Web Development","Digital Design","Digital Marketing","AI & Productivity","Study & Exam Skills","Career & Entrepreneurship"].map(x=>`<div class="card"><h3>${x}</h3><p>Short lessons → practical project → assessment.</p><button class="btn gold" onclick="openM('<h2>${x}</h2><p>Original PASSCOGH practical modules belong here.</p>')">Open</button></div>`).join("")}</div>`}
function openM(x){document.getElementById("mb").innerHTML=x;document.getElementById("modal").classList.add("show")}function closeM(){document.getElementById("modal").classList.remove("show")}function hideAd(){ad.classList.remove("show");studyStart=Date.now()}
boot();
</script></body></html>
